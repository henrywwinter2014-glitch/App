name: LevelUp
options:
  bundleIdPrefix: com.example.levelup
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # <-- set your Apple Developer Team ID here (or set it in Xcode > Signing & Capabilities)
    TARGETED_DEVICE_FAMILY: "1" # iPhone only; add "2" for iPad support once tested

targets:
  LevelUp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    resources:
      - path: App/Resources/Assets.xcassets
    info:
      path: App/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "LevelUp reads your steps, exercise, stand hours and sleep to calculate your daily Fitness Score."
        NSHealthUpdateUsageDescription: "LevelUp does not write health data. This is required by HealthKit even for read-only access."
        NSCameraUsageDescription: "LevelUp uses the camera to photograph a wardrobe item or today's outfit for AI scoring."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/Resources/LevelUp.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.levelup
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.levelup
        PRODUCT_NAME: LevelUp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    dependencies:
      - target: DeviceActivityMonitorExtension
        embed: true
      - target: ShieldConfigurationExtension
        embed: true
      - target: ShieldActionExtension
        embed: true

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DeviceActivityMonitorExtension
      - path: Shared
    info:
      path: DeviceActivityMonitorExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.levelup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.levelup.deviceactivitymonitor
        PRODUCT_NAME: DeviceActivityMonitorExtension
        SKIP_INSTALL: true

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigurationExtension
      - path: Shared
    info:
      path: ShieldConfigurationExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.levelup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.levelup.shieldconfiguration
        PRODUCT_NAME: ShieldConfigurationExtension
        SKIP_INSTALL: true

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldActionExtension
      - path: Shared
    info:
      path: ShieldActionExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldActionExtension/ShieldActionExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.levelup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.levelup.shieldaction
        PRODUCT_NAME: ShieldActionExtension
        SKIP_INSTALL: true

schemes:
  LevelUp:
    build:
      targets:
        LevelUp: all
    run:
      config: Debug
    archive:
      config: Release
